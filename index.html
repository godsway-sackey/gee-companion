<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#176B57" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="gee-companion" />
  <meta name="description" content="Everyday Health. Everyday Wellness. A private, native iOS offline-first wellness companion." />
  <title>gee-companion</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-cluster">
        <!-- App Logo Mark: Gold heart + white ECG pulse + forest-green dot -->
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 36 38" fill="none" xmlns="http://www.w3.org/2000/svg" class="heart-logo-svg">
            <!-- Forest Green Dot (on top of the heart) -->
            <circle cx="18" cy="4.5" r="3.5" fill="#176B57"/>
            <!-- Gold Heart (below the dot) -->
            <path d="M18 34S4 24.5 4 14.5A7 7 0 0 1 16 9.8L18 12.2l2-2.4A7 7 0 0 1 32 14.5C32 24.5 18 34 18 34Z" fill="#D9A441"/>
            <!-- White ECG / Pulse Line -->
            <path d="M7 19h5.5l2-4.5 3 9 2.5-6.5 1.5 2H29" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-title-row">
            <span class="app-brand-name">gee-companion</span>
          </div>
          <p class="eyebrow" id="dateLabel"></p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="installBtn" class="ios-install-btn hidden" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Install</span>
        </button>
      </div>
    </header>

    <div class="page-title-banner">
      <h1 id="pageTitle">Today</h1>
      <span id="offlineBadge" class="offline-badge hidden" title="Running completely offline">Offline Ready</span>
    </div>

    <main id="view" class="view" aria-live="polite"></main>

    <!-- iOS Native Tab Bar with SVG glyphs -->
    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="today" class="nav-item active" type="button" aria-label="Today">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <small>Today</small>
      </button>
      <button data-route="log" class="nav-item" type="button" aria-label="Log">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        <small>Log</small>
      </button>
      <button data-route="progress" class="nav-item" type="button" aria-label="Progress">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
        </svg>
        <small>Progress</small>
      </button>
      <button data-route="plan" class="nav-item" type="button" aria-label="Plan">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="m9 14 2 2 4-4"/>
        </svg>
        <small>Plan</small>
      </button>
      <button data-route="more" class="nav-item" type="button" aria-label="More">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
        </svg>
        <small>More</small>
      </button>
    </nav>
  </div>

  <!-- iOS Sheet-Style Survey Modal for One-by-One Logging -->
  <dialog id="modal" class="ios-sheet">
    <div class="sheet-container">
      <div class="sheet-handle" aria-hidden="true"></div>

      <!-- Survey Header Bar -->
      <div class="sheet-nav-bar">
        <button id="surveyBackBtn" class="sheet-nav-btn hidden" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          <span>Back</span>
        </button>
        <div class="sheet-title-group">
          <span class="sheet-eyebrow" id="modalEyebrow">Quick log</span>
          <span class="sheet-step-badge" id="surveyStepBadge"></span>
        </div>
        <button id="surveyCloseBtn" class="sheet-close-btn" type="button" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Survey Progress Bar -->
      <div class="survey-progress-track" id="surveyProgressTrack">
        <div class="survey-progress-bar" id="surveyProgressFill" style="width: 0%;"></div>
      </div>

      <!-- Dynamic Question Content -->
      <div id="modalBody" class="sheet-body"></div>

      <!-- Survey Footer Actions -->
      <div id="surveyFooter" class="sheet-footer"></div>
    </div>
  </dialog>

  <!-- iOS Dynamic Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
